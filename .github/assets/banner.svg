<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Seraf — image optimization">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d7f"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="o1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff3d7f" stop-opacity=".55"/><stop offset="1" stop-color="#ff3d7f" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c3aed" stop-opacity=".6"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0891b2" stop-opacity=".45"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07080f" stop-opacity="0"/><stop offset="1" stop-color="#07080f"/></linearGradient>
    <clipPath id="r"><rect width="1280" height="380" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="380" fill="#07080f"/>
    <circle cx="160" cy="40" r="300" fill="url(#o1)"/>
    <circle cx="1120" cy="120" r="340" fill="url(#o2)"/>
    <circle cx="640" cy="420" r="300" fill="url(#o3)"/>
    <rect width="1280" height="380" fill="url(#grid)"/>
    <rect y="260" width="1280" height="120" fill="url(#fade)"/>

    <!-- compare-slider motif -->
    <g transform="translate(860 70)">
      <rect width="320" height="220" rx="22" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="14" y="14" width="292" height="192" rx="14" fill="#0d0f1c"/>
      <path d="M14 170 L90 104 L150 150 L210 86 L306 160 L306 206 L14 206 Z" fill="url(#g)" opacity=".85"/>
      <circle cx="96" cy="64" r="20" fill="#fbbf24" opacity=".9"/>
      <rect x="158" y="14" width="2" height="192" fill="#ffffff"/>
      <circle cx="159" cy="110" r="17" fill="url(#g)"/>
      <path d="M152 110h14M155 106l-4 4 4 4M163 106l4 4-4 4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="26" y="176" width="92" height="22" rx="8" fill="#07080f" fill-opacity=".8"/>
      <text x="72" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#eef0fb">JPG · 2.7 MB</text>
      <rect x="200" y="176" width="94" height="22" rx="8" fill="#07080f" fill-opacity=".8"/>
      <text x="247" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#34d399">WEBP · 366 KB</text>
    </g>

    <text x="90" y="160" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#g)">Seraf</text>
    <text x="94" y="214" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#eef0fb">Lighter images. Faster websites.</text>
    <text x="94" y="262" direction="rtl" unicode-bidi="embed" text-anchor="end" font-family="Vazirmatn, Tahoma, Segoe UI, sans-serif" font-size="24" fill="#9aa1bd">بهینه‌سازی تصویر · وب‌سرویس API · افزونهٔ وردپرس</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">
      <rect x="94" y="296" width="74" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/><text x="131" y="317" text-anchor="middle" fill="#eef0fb">WebP</text>
      <rect x="178" y="296" width="70" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/><text x="213" y="317" text-anchor="middle" fill="#eef0fb">AVIF</text>
      <rect x="258" y="296" width="70" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/><text x="293" y="317" text-anchor="middle" fill="#eef0fb">JPEG</text>
      <rect x="338" y="296" width="62" height="32" rx="16" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/><text x="369" y="317" text-anchor="middle" fill="#eef0fb">PNG</text>
      <rect x="410" y="296" width="132" height="32" rx="16" fill="url(#g)"/><text x="476" y="317" text-anchor="middle" fill="#ffffff">seraf.ir</text>
    </g>
  </g>
</svg>
